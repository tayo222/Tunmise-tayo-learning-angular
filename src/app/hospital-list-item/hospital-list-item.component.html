<mat-card class="hospital-list-item">
  <mat-card-header>
    <mat-card-title>{{ staff?.firstName }} {{ staff?.lastName }}</mat-card-title>
    <mat-card-subtitle>ID: {{ staff?.id }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>Department: {{ staff?.department }}</p>
    <p>Role: {{ staff?.role }}</p>
    <p>On Call: {{ staff?.isOnCall ? 'Yes' : 'No' }}</p>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-raised-button color="accent" (click)="editStaff(staff?.id)">
      Edit
    </button>
    <button mat-raised-button color="warn" (click)="deleteStaff(staff?.id)">
      Delete
    </button>
  </mat-card-actions>
</mat-card>
