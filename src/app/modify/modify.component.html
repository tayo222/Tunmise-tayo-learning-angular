<h2>Modify Staff Member</h2>

<form [formGroup]="modifyForm" (ngSubmit)="onSubmit()" class="modify-form">
  <mat-form-field appearance="fill">
    <mat-label>First Name</mat-label>
    <input
      matInput
      id="firstName"
      formControlName="firstName"
      required
    />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Last Name</mat-label>
    <input
      matInput
      id="lastName"
      formControlName="lastName"
      required
    />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Department</mat-label>
    <input
      matInput
      id="department"
      formControlName="department"
      required
    />
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Role</mat-label>
    <input
      matInput
      id="role"
      formControlName="role"
      required
    />
  </mat-form-field>

  <mat-checkbox id="isOnCall" formControlName="isOnCall">
    On Call
  </mat-checkbox>

  <mat-form-field appearance="fill">
    <mat-label>Image URL</mat-label>
    <input
      matInput
      id="imageUrl"
      formControlName="imageUrl"
      required
    />
  </mat-form-field>

  <div class="form-actions">
    <button mat-raised-button color="primary" type="submit" [disabled]="modifyForm.invalid">
      Save
    </button>
    <button mat-raised-button color="warn" type="reset">
      Reset
    </button>
  </div>
</form>
