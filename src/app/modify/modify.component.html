<h2>Modify Staff Member</h2>

<form [formGroup]="modifyForm" (ngSubmit)="onSubmit()">
  <label for="firstName">First Name:</label>
  <input id="firstName" formControlName="firstName" required>

  <label for="lastName">Last Name:</label>
  <input id="lastName" formControlName="lastName" required>

  <label for="department">Department:</label>
  <input id="department" formControlName="department" required>

  <label for="role">Role:</label>
  <input id="role" formControlName="role" required>

  <label for="isOnCall">On Call:</label>
  <input type="checkbox" id="isOnCall" formControlName="isOnCall">

  <label for="imageUrl">Image URL:</label>
  <input id="imageUrl" formControlName="imageUrl" required>

  <button type="submit">Add/Update Item</button>
</form>
