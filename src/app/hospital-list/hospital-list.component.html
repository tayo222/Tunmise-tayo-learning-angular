<div class="hospital-list">
  <h2>Hospital Staff</h2>
  <ul>
    <li *ngFor="let staff of hospitalStaff">
      <img [src]="staff.imageUrl" alt="{{ staff.firstName | titlecase }} {{ staff.lastName | titlecase }}" class="staff-image" width="150" height="150"/>

      <div class="staff-details">
        <h3>{{ staff.firstName | titlecase }} {{ staff.lastName | titlecase }}</h3>

        <p>Department: {{ staff.department | uppercase }}</p>
        <p>Role: {{ staff.role | uppercase }}</p>

        <!-- Using SlicePipe for department shortening -->
        <p>Department (Short): {{ staff.department | slice:0:15 }}</p>

        <!-- Using your custom onCallStatus pipe -->
        <p>On Call: {{ staff.isOnCall | onCallStatus }}</p>
      </div>

      <div class="staff-actions">
        <button (click)="editStaff(staff.id)">Edit</button>
        <button (click)="deleteStaff(staff.id)">Delete</button>
      </div>
    </li>
  </ul>
</div>
