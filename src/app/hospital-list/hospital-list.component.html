<div class="hospital-list">
  <h2>Hospital Staff</h2>
  <ul>
    <li *ngFor="let staff of hospitalStaff" [appHoverHighlight]="'#f0f8ff'">
      <img
        [ngSrc]="staff.imageUrl"
        alt="{{ staff.firstName }} {{ staff.lastName }}"
        class="staff-image"
        width="150"
        height="150"
      />
      <div class="staff-details" [appHoverHighlight]="'#e6f7ff'">
        <h3>{{ staff.firstName }} {{ staff.lastName }}</h3>
        <p>Department: {{ staff.department }}</p>
        <p>Role: {{ staff.role }}</p>
        <p *ngIf="staff.isOnCall">Currently On Call</p>
      </div>
      <div class="staff-actions">
        <button [appHoverHighlight]="'#d3f9d8'" (click)="editStaff(staff.id)">Edit</button>
        <button [appHoverHighlight]="'#f8d7da'" (click)="deleteStaff(staff.id)">Delete</button>
      </div>
    </li>
  </ul>
</div>
