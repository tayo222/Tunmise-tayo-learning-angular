<mat-card class="hospital-list">
  <mat-toolbar color="primary">
    <h2>Hospital Staff</h2>
  </mat-toolbar>
  <mat-list>
    <mat-list-item *ngFor="let staff of hospitalStaff">
      <mat-card class="staff-item">
        <mat-card-header>
          <div mat-card-avatar>
            <img
              mat-card-avatar
              [ngSrc]="staff.imageUrl"
              alt="{{ staff.firstName }} {{ staff.lastName }}"
              class="staff-image"
              width="50"
              height="50"
            />
          </div>
          <mat-card-title>{{ staff.firstName }} {{ staff.lastName }}</mat-card-title>
          <mat-card-subtitle>Department: {{ staff.department }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p>Role: {{ staff.role }}</p>
          <p *ngIf="staff.isOnCall" class="on-call">Currently On Call</p>
        </mat-card-content>

        <mat-card-actions align="end">
          <button mat-raised-button color="accent" (click)="editStaff(staff.id)">
            Edit
          </button>
          <button mat-raised-button color="warn" (click)="deleteStaff(staff.id)">
            Delete
          </button>
        </mat-card-actions>
      </mat-card>
    </mat-list-item>
  </mat-list>
</mat-card>
